[DEFAULT]
PRODUCT_COMPONENT=database
PIPELINE_STACK_NAME = ala-${PRODUCT_NAME}-${PRODUCT_COMPONENT}-pipeline-${ENVIRONMENT}
DATABASE_STACK_FILE_PFIX = database
DATABASE_STACK_NAME = ala-${PRODUCT_NAME}-${PRODUCT_COMPONENT}-${ENVIRONMENT}
AUTO_DEPLOY = false
SLACK_DEPLOY_NOTIFICATION = true
SLACK_ALERT_CHANNEL = testing-deployments

# RDS
ADMIN_USER = admin
BACKTRACK_WINDOW = 3600 # only applicable for MySQL, in seconds, between 0 - 259200 seconds (3 days)
BACKUP_RETENTION = 1 # number of days to retain automated backups, between 1 - 35 days
CREATE_REPLICA = false # create a read replica of the database
DB_INSTANCE_NAME = alerts-${ENVIRONMENT}
DB_ENGINE = aurora-mysql # "aurora-mysql" or "aurora-postgresql"
ENGINE_MODE = provisioned # provisioned or serverlessv2
DB_VERSION = 8.4.mysql_aurora.8.4.7 # Aurora MySQL or PostgreSQL version
# supported versions for provisioned:
# https://docs.aws.amazon.com/AmazonRDS/latest/AuroraMySQLReleaseNotes/AuroraMySQL.Updates.84Updates.html
# https://docs.aws.amazon.com/AmazonRDS/latest/AuroraPostgreSQLReleaseNotes/aurorapostgresql-release-calendar.html#aurorapostgresql.minor.versions.supported
DELETION_PROTECTION = false # set to true in production
DB_PARAM_GRP_FAMILY = aurora-mysql8.4 # aurora-mysql8.4 for MySQL, aurora-postgresql18 for PostgreSQL
INSTANCE_CLASS = db.t4g.medium # only used when ENGINE_MODE is provisioned
DATABASE_INSIGHTS_MODE = standard # "standard" or "advanced"
# Performance insights is deprecated
# https://docs.aws.amazon.com/AmazonRDS/latest/AuroraUserGuide/Concepts.Aurora_Fea_Regions_DB-eng.Feature.PerfInsights.html
PERFORMANCE_INSIGHTS = false # true or false
ENHANCED_MONITORING = 0 # enhanced monitoring interval in seconds. Set to 0 to disable.
# The snapshot ARN to restore the database from. Set to "false" to not use a snapshot.
RDS_SNAPSHOT_RESTORE = arn:aws:rds:ap-southeast-2:748909248546:cluster-snapshot:alerts-mysql-upgrade # The snapshot ARN to restore the database from. Set to "false" to not use a snapshot.
EXPORT_LOGS = false


[development]
# code pipeline
PIPELINE_STACK_NAME = ala-${PRODUCT_NAME}-${PRODUCT_COMPONENT}-pipeline-${CLEAN_BRANCH}
DATABASE_STACK_NAME = ala-${PRODUCT_NAME}-${PRODUCT_COMPONENT}-${CLEAN_BRANCH}
AUTO_DEPLOY = true

# RDS
DB_INSTANCE_NAME = alerts-${CLEAN_BRANCH}
#RDS_SNAPSHOT_RESTORE = arn:aws:rds:ap-southeast-2:748909248546:cluster-snapshot:ala-alerts-database-feature-rds-pipeline-updates-snapshot-dbcluster-wpangbshgwib

[testing]
AUTO_DEPLOY = true
# RDS

[staging]
# RDS
PERFORMANCE_INSIGHTS = true

[production]
# RDS
BACKTRACK_WINDOW = 259200 # 3 days (259200 seconds)
DATABASE_INSIGHTS_MODE = advanced # "standard" or "enhanced"
DELETION_PROTECTION = true
PERFORMANCE_INSIGHTS = true
ENHANCED_MONITORING = 60
BACKUP_RETENTION = 30
CREATE_REPLICA = false
SLACK_ALERT_CHANNEL = deployments
