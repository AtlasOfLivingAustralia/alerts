# Local MySQL for the minikube run of the alerts stack.
#
# Stands in for the Aurora cluster that the AWS pipeline points the chart at:
# cicd/local/values-minikube.yaml sets rds.externalName to
# mysql-local.<namespace>.svc.cluster.local, so the chart's ExternalName service
# ("mysql-rds") and the Liquibase migration Job both resolve to this pod.
#
# Credentials match docker/docker-compose.yml so the same app config works either way.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mysql-local-data
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: mysql-local
  labels:
    app: mysql-local
spec:
  selector:
    app: mysql-local
  ports:
    - port: 3306
      targetPort: 3306
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql-local
  labels:
    app: mysql-local
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: mysql-local
  template:
    metadata:
      labels:
        app: mysql-local
    spec:
      containers:
        - name: mysql
          image: mysql:8.1.0
          args:
            - --default-authentication-plugin=mysql_native_password
          env:
            - name: MYSQL_DATABASE
              value: alerts
            - name: MYSQL_USER
              value: alerts_user
            - name: MYSQL_PASSWORD
              value: password
            - name: MYSQL_ROOT_PASSWORD
              value: password
          ports:
            - containerPort: 3306
          readinessProbe:
            exec:
              command: ["bash", "-c", "mysqladmin ping -h 127.0.0.1 -uroot -p$MYSQL_ROOT_PASSWORD"]
            initialDelaySeconds: 15
            periodSeconds: 5
            failureThreshold: 30
          resources:
            requests:
              cpu: "100m"
              memory: "512Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
          volumeMounts:
            - name: data
              mountPath: /var/lib/mysql
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: mysql-local-data

