version: 0.2

env:
  shell: bash
  variables:
    JAVA_TOOL_OPTIONS: -Dhttps.protocols=TLSv1.2

phases:
  install:
    commands:
      - echo Installing dependencies...
      - cat /etc/lsb-release
      - apt update -y
        && apt-get -q -y install openjdk-11-jdk
        && pip3 install jinja2
        && curl -fsSL -o get_helm.sh https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3
        && chmod 700 get_helm.sh
        && ./get_helm.sh

  build:
    commands:
      - echo Build started on $(date)
      - aws eks --region ap-southeast-2 update-kubeconfig --name $EKS_CLUSTER_NAME
      - kubectl config set-context --current --namespace=$EKS_NAMESPACE
      - echo "Creating service account for alerts..."
      - |
        ALERTS_ROLE_ARN=$(aws cloudformation describe-stacks --stack-name $BASE_STACK_NAME \
          --query "Stacks[0].Outputs[?OutputKey=='AlertsRoleArn'].OutputValue" --output text)
      - printf "$(kubectl config current-context)\n"
      - |
        eksctl create iamserviceaccount --name alerts-service-account-$CLEAN_BRANCH \
          --namespace $EKS_NAMESPACE --cluster $EKS_CLUSTER_NAME --attach-role-arn $ALERTS_ROLE_ARN \
          --approve --override-existing-serviceaccounts \
          --tags "product=alerts,environment=development,branch=${CLEAN_BRANCH}"
      - echo "Service account created."
      - echo "Deploying alerts via helm..."
      - cd helm
      - export BUILD_TAG_FROM_ARTIFACT=$(cat "$CODEBUILD_SRC_DIR_BuildTagArtifact/build_tag.txt")
      - |
        helm upgrade --install $HELM_RELEASE_NAME . -n $EKS_NAMESPACE \
          --set image.repository=$ECR_REPO \
          --set image.tag=$BUILD_TAG_FROM_ARTIFACT \
          --set ingress.hostname=$DOMAIN_NAME \
          --set rds.externalName=$DB_WRITE_ENDPOINT \
          --set ingress.certificateArn=$CERTIFICATE_ARN \
          --set secret.name=alerts-config-secret-$CLEAN_BRANCH \
          --set serviceAccount.name=alerts-service-account-$CLEAN_BRANCH \
          --set rds.name=mysql-rds-$CLEAN_BRANCH \
          --wait \
          --timeout 10m \
          -f $CODEBUILD_SRC_DIR_ExportConfigArtifact/helm-values.yaml
      - |
        HELM_STATUS=$(helm status $HELM_RELEASE_NAME -n $EKS_NAMESPACE --output json | jq -r '.info.status')
        echo "Helm release status: $HELM_STATUS"
        if [ "$HELM_STATUS" != "deployed" ]; then
          echo "Helm release is not in deployed state. Current status: $HELM_STATUS"
          exit 1
        fi
        echo "Helm release successfully deployed."
  post_build:
    commands:
      # Post-deploy cleanup logic:
      # - read Liquibase status from /tmp/liquibase-status.env
      # - if no DB changes were pending, do nothing
      # - if DB changes were pending and deploy succeeded, delete the snapshot
      # - if deploy failed, restore the DB from the snapshot and rename the current DB instance to a broken name for inspection

      # Capture build status and read status variables
      - echo Post-build phase...
      - echo Build completed on $(date)
      # CODEBUILD_BUILD_SUCCEEDING is set by CodeBuild runtime: 1=succeeding, 0=failed
      - |  
        BUILD_SUCCEEDED=$( [ "$CODEBUILD_BUILD_SUCCEEDING" = "1" ] && echo "true" || echo "false" )
        echo "Build phase status: BUILD_SUCCEEDED=$BUILD_SUCCEEDED"

        # Read Liquibase status from migration phase
        if [ ! -f /tmp/liquibase-status.env ]; then
          echo "No status env file found. No database changes were pending."
          exit $( [ "$BUILD_SUCCEEDED" = "true" ] && echo 0 || echo 1 )
        fi

        source /tmp/liquibase-status.env
        echo "Loaded status: HAS_PENDING_CHANGES=$HAS_PENDING_CHANGES, SNAPSHOT_CREATED=$SNAPSHOT_CREATED"

        # Only proceed if changes were made
        if [ "$HAS_PENDING_CHANGES" != "true" ]; then
          echo "No database changes were pending. Exiting."
          exit $( [ "$BUILD_SUCCEEDED" = "true" ] && echo 0 || echo 1 )
        fi
        
        echo "Database changes were made. Proceeding with snapshot cleanup logic..."
        
        # Check build status and decide on snapshot
        if [ "$BUILD_SUCCEEDED" = "true" ]; then
          echo "Build phase succeeded. Checking if snapshot should be deleted..."
          if [ "$SNAPSHOT_CREATED" = "true" ]; then
            echo "Deployment succeeded with database changes. Deleting backup snapshot: $SNAPSHOT_ID"
            # aws rds delete-db-cluster-snapshot \
            #  --db-cluster-snapshot-identifier "$SNAPSHOT_ID" || echo "Warning: Could not delete snapshot $SNAPSHOT_ID"
            echo "The backup instance is $SNAPSHOT_ID for inspection."
            echo "Once confirmed, you can delete the instance manually."
          else
            echo "Snapshot was not created despite pending changes."
          fi
        else
          echo "Build phase failed. Starting database rollback using snapshot: $SNAPSHOT_ID"
          DB_CLUSTER_IDENTIFIER=${DB_CLUSTER_IDENTIFIER:-$(echo "$DB_WRITE_ENDPOINT" | cut -d'.' -f1)}
          ROLLBACK_CLUSTER_IDENTIFIER="${DB_CLUSTER_IDENTIFIER}-rollback-$(date +%Y%m%d%H%M%S)"
          echo "Restoring Aurora DB cluster from snapshot $SNAPSHOT_ID to new cluster $ROLLBACK_CLUSTER_IDENTIFIER..."
          aws rds restore-db-cluster-from-snapshot \
            --db-cluster-identifier "$ROLLBACK_CLUSTER_IDENTIFIER" \
            --snapshot-identifier "$SNAPSHOT_ID" \
            --engine aurora-mysql
          echo "Waiting for restored DB cluster to become available..."
          aws rds wait db-cluster-available \
            --db-cluster-identifier "$ROLLBACK_CLUSTER_IDENTIFIER"
          echo "Rollback restore complete. New cluster: $ROLLBACK_CLUSTER_IDENTIFIER"
          echo "Update application endpoint manually if you want to fail over to the rollback cluster."
          exit 1
        fi

artifacts:
  base-directory: $CODEBUILD_SRC_DIR
  files:
    - '**/*'