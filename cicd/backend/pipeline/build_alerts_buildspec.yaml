version: 0.2

env:
  shell: bash
  variables:
    JAVA_TOOL_OPTIONS: -Dhttps.protocols=TLSv1.2
    DOCKER_BUILDKIT: "1"
  secrets-manager:
    DOCKER_USERNAME: ala-secrets-production:dockerhub-username
    DOCKER_PASSWORD: ala-secrets-production:dockerhub-password
  exported-variables:
    - BUILD_TAG

phases:
  install:
    runtime-versions:
      java: corretto17
    commands:
      - echo Installing dependencies...
      - apt update -y
        && cat /etc/lsb-release
        && curl -s "https://get.sdkman.io" | bash
        && chmod a+x /root/.sdkman/bin/sdkman-init.sh
        && source /root/.sdkman/bin/sdkman-init.sh && sdk install grails 6.0.0 /root/.sdkman/candidates/grails/6.0.0
      - java -version
      - echo Registering QEMU emulators for cross-platform builds...
      - docker run --rm --privileged public.ecr.aws/eks-distro-build-tooling/binfmt-misc:qemu-v9.2.2 --install all
      - docker buildx version
      - docker buildx create --use --name multiarch-builder
      - echo Logging in to Docker Hub...
      - printf '%s' "$DOCKER_PASSWORD" | docker login -u "$DOCKER_USERNAME" --password-stdin
      - echo Logging in to Amazon ECR...
      - aws ecr get-login-password | docker login -u AWS --password-stdin "https://$AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com"

  build:
    commands:
      - echo Build started on $(date)
      - echo Building the project...
      - ./gradlew build --stacktrace
      - ./gradlew bootWar

  post_build:
    commands:
      - echo Post-build phase...
      - echo Build completed on $(date)
      - rm -rf build/libs/*-plain.war
      - BUILD_TAG=$CLEAN_BRANCH-$CODEBUILD_BUILD_NUMBER
      - echo build tag is $BUILD_TAG
      - echo "$BUILD_TAG" > build_tag.txt
      - echo Building and pushing the multi-arch Docker image to ECR...
      - |
        if docker pull "$ECR_REPO:latest"; then
          CACHE_ARGS="--cache-from $ECR_REPO:latest"
        else
          CACHE_ARGS=""
        fi
      - |
        docker buildx build --platform linux/amd64,linux/arm64 \
                            -f Dockerfile \
                            $CACHE_ARGS \
                            --build-arg BUILDKIT_INLINE_CACHE=1 \
                            -t $ECR_REPO:$BUILD_TAG \
                            -t $ECR_REPO:latest \
                            --push \
                            .
#     Check if liquibase image already exists in ECR, if not build and push it, otherwise skip the build and push.
      - |
        set -euo pipefail
        LIQUIBASE_IMAGE_HASH=$(
          {
            echo "multiarch-v1"
            sha256sum docker/liquibase/Dockerfile
            find src/main/resources/db/changelog -type f -print0 | sort -z | xargs -0 sha256sum
          } | sha256sum | cut -c1-16
        )
        LIQUIBASE_IMAGE_TAG="liquibase-4.27.0-${LIQUIBASE_IMAGE_HASH}"
        echo "Liquibase image tag is $LIQUIBASE_IMAGE_TAG"
        if IMAGE_LOOKUP=$(aws ecr describe-images \
          --repository-name "${ECR_REPO##*/}" \
          --image-ids imageTag="$LIQUIBASE_IMAGE_TAG" 2>&1); then
          echo "Liquibase image already exists. Skipping build and push."
        elif [[ "$IMAGE_LOOKUP" == *ImageNotFoundException* ]]; then
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --progress=plain \
            --pull \
            --file docker/liquibase/Dockerfile \
            --tag "$ECR_REPO:$LIQUIBASE_IMAGE_TAG" \
            --push \
            .
          buildx_status=$?
          set -e
          echo "Liquibase Buildx exit status: $buildx_status"
          exit "$buildx_status"
        else
          echo "$IMAGE_LOOKUP"
          echo "Unable to determine whether the Liquibase image exists."
          exit 1
        fi
        printf '%s\n' "$LIQUIBASE_IMAGE_TAG" > liquibase_image_tag.txt

artifacts:
  files:
    - build_tag.txt
    - liquibase_image_tag.txt
  discard-paths: yes


cache:
  paths:
    - '/root/.gradle/caches/**/*'
    - '/root/.gradle/wrapper/dists/**/*'
