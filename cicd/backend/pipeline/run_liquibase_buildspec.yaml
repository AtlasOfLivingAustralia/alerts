version: 0.2

env:
  shell: bash

phases:
  install:
    commands:
      - echo Installing Liquibase CLI...
      - apt-get update -y
      - apt-get install -y curl jq
      - curl -sSL -o liquibase.tar.gz https://github.com/liquibase/liquibase/releases/download/v4.27.0/liquibase-4.27.0.tar.gz
      - mkdir -p liquibase
      - tar -xzf liquibase.tar.gz -C liquibase
      - chmod +x liquibase/liquibase
      - echo Downloading MySQL JDBC driver...
      - mkdir -p liquibase/lib
      - curl -fL -o liquibase/lib/mysql-connector-java.jar https://repo1.maven.org/maven2/com/mysql/mysql-connector-j/8.0.33/mysql-connector-j-8.0.33.jar
      - file liquibase/lib/mysql-connector-java.jar
      - unzip -t liquibase/lib/mysql-connector-java.jar | tail -3

  build:
    commands:
      - echo Running Liquibase migration on $(date)
      - DB_USERNAME=${DB_USERNAME:-admin}
      - DB_NAME=${PRODUCT_NAME}${ENVIRONMENT}
      - HAS_PENDING_CHANGES=false
      - SNAPSHOT_ID=
      - SNAPSHOT_CREATED=false
      - DB_PASSWORD=$(aws secretsmanager get-secret-value --secret-id "$SECRET_NAME" --query 'SecretString' --output text | jq -r '."db-password"')
      - |
        set -euo pipefail
        if ! LIQUIBASE_STATUS=$(liquibase/liquibase \
          --changelog-file=src/main/resources/db/changelog/db.changelog-master.xml \
          --url="jdbc:mysql://${DB_WRITE_ENDPOINT}/${DB_NAME}?useUnicode=true&characterEncoding=UTF-8&useSSL=false" \
          --driver=com.mysql.cj.jdbc.Driver \
          --username="$DB_USERNAME" \
          --password="$DB_PASSWORD" \
          --log-level=info \
          status 2>&1); then
          echo "$LIQUIBASE_STATUS"
          echo "Liquibase status command failed."
          exit 1
        fi
        echo "Liquibase status output: $LIQUIBASE_STATUS"
        if echo "$LIQUIBASE_STATUS" | grep -qi "has not been applied"; then
          HAS_PENDING_CHANGES=true
        else
          HAS_PENDING_CHANGES=false
        fi
        echo "HAS_PENDING_CHANGES=$HAS_PENDING_CHANGES"
      - |
        set -euo pipefail
        if [ "$HAS_PENDING_CHANGES" = "true" ]; then
          TIMESTAMP=$(date +%Y%m%d%H%M%S)
          SNAPSHOT_ID="${DB_NAME}-${TIMESTAMP}-snapshot"
          if aws rds describe-db-instances --db-instance-identifier "$DB_NAME" >/dev/null 2>&1; then
            echo "Creating RDS snapshot: $SNAPSHOT_ID"
            aws rds create-db-snapshot \
              --db-instance-identifier "$DB_NAME" \
              --db-snapshot-identifier "$SNAPSHOT_ID"
            echo "Waiting for snapshot $SNAPSHOT_ID to become available..."
            if ! aws rds wait db-snapshot-available \
              --db-snapshot-identifier "$SNAPSHOT_ID"; then
              echo "Snapshot $SNAPSHOT_ID did not become available. Failing migration step."
              exit 1
            fi
            SNAPSHOT_CREATED=true
            echo "Snapshot $SNAPSHOT_ID is available."
          else
            echo "DB instance $DB_NAME not found. Assuming first-time deployment and skipping snapshot creation."
          fi
          echo "Pending changes detected. Running Liquibase update..."
          liquibase/liquibase \
            --changelog-file=src/main/resources/db/changelog/db.changelog-master.xml \
            --url="jdbc:mysql://${DB_WRITE_ENDPOINT}/${DB_NAME}?useUnicode=true&characterEncoding=UTF-8&useSSL=false" \
            --driver=com.mysql.cj.jdbc.Driver \
            --username="$DB_USERNAME" \
            --password="$DB_PASSWORD" \
            --log-level=info \
            update
        else
          echo "No pending changes detected. Skipping Liquibase update."
        fi

  post_build:
    commands:
      - echo Liquibase migration complete on $(date)
      # Persist migration outcome for downstream stages (e.g. deploy alerts, determine rollback/cleanup decisions).
      - echo "Exporting HAS_PENDING_CHANGES=$HAS_PENDING_CHANGES"
      - echo "Exporting SNAPSHOT_CREATED=$SNAPSHOT_CREATED"
      - export HAS_PENDING_CHANGES=$HAS_PENDING_CHANGES
      - export SNAPSHOT_CREATED=$SNAPSHOT_CREATED
      - printf 'HAS_PENDING_CHANGES=%s\nSNAPSHOT_ID=%s\nSNAPSHOT_CREATED=%s\n' "$HAS_PENDING_CHANGES" "$SNAPSHOT_ID" "$SNAPSHOT_CREATED" > /tmp/liquibase-status.env
      - cat /tmp/liquibase-status.env
      - |
        # Respect the build result: on success continue; on failure, clean up snapshot when needed and
        # return the same failure code so CodePipeline still marks this action as failed.
        # if liquibase update failed, since liquibase automatically rollbacks the changes, we can just delete the snapshot and exit with failure code
        BUILD_EXIT_CODE=$( [ "$CODEBUILD_BUILD_SUCCEEDING" = "1" ] && echo 0 || echo 1 )
        if [ "$BUILD_EXIT_CODE" -eq 0 ]; then
          echo "Liquibase build succeeded. Continuing."
        else
          if [ "$HAS_PENDING_CHANGES" = "false" ]; then
            echo "Liquibase build failed and no pending DB changes were found. Exiting with build status code $BUILD_EXIT_CODE."
            exit "$BUILD_EXIT_CODE"
          fi
          echo "Liquibase build failed with pending DB changes. Checking snapshot cleanup before exit."
          if [ "$SNAPSHOT_CREATED" = "true" ] && [ -n "$SNAPSHOT_ID" ]; then
            echo "Deleting snapshot created during failed run: $SNAPSHOT_ID"
            aws rds delete-db-snapshot --db-snapshot-identifier "$SNAPSHOT_ID" || echo "Warning: Could not delete snapshot $SNAPSHOT_ID"
          else
            echo "No snapshot to delete (SNAPSHOT_CREATED=$SNAPSHOT_CREATED, SNAPSHOT_ID=$SNAPSHOT_ID)."
          fi
          exit "$BUILD_EXIT_CODE"
        fi

